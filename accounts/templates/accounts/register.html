{% extends 'base.html' %}

{% block title %}Create an account{% endblock %}

{% block content %}
<div class="auth">
  <h1>Create an account</h1>
  <p class="muted">Choose Shipper if you have goods to move, or Transporter if you have a truck.</p>
  <form method="post" class="card">
    {% csrf_token %}
    {{ form.as_p }}
    <p>
      <label for="ref_code">Referral code (optional)</label>
      <input id="ref_code" type="text" name="ref_code" value="{{ request.session.ref_code|default:'' }}" maxlength="12" autocomplete="off">
    </p>
    <button type="submit" class="btn btn-primary w-100">Create account</button>
  </form>
  <p class="mt-3">Already registered? <a href="{% url 'login' %}">Log in</a></p>
</div>
{% endblock %}
