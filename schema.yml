openapi: 3.0.3
info:
  title: TruckLink API
  version: 1.0.0
  description: Loads, offers and trucks across Zimbabwe.
paths:
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      summary: Delete the token you are using
      tags:
      - auth
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/token/:
    post:
      operationId: auth_token_create
      description: Exchange a username and password for an API token.
      summary: Get an API token
      tags:
      - auth
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AuthToken'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AuthToken'
          application/json:
            schema:
              $ref: '#/components/schemas/AuthToken'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
          description: ''
  /api/loads/:
    get:
      operationId: loads_list
      summary: Open loads, urgent first
      parameters:
      - in: query
        name: cargo
        schema:
          type: string
        description: Cargo type, for example general or perishable
      - in: query
        name: destination
        schema:
          type: string
        description: Destination town
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: pickup
        schema:
          type: string
        description: Pickup town
      - in: query
        name: truck
        schema:
          type: string
        description: Show loads that this truck type can take
      tags:
      - loads
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLoadList'
          description: ''
    post:
      operationId: loads_create
      summary: Post a load (shippers)
      tags:
      - loads
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoadCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoadCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoadCreate'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Load'
          description: ''
  /api/loads/{id}/:
    get:
      operationId: loads_retrieve
      summary: One load, with your offer, booking and contacts when they apply to
        you
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - loads
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoadDetail'
          description: ''
  /api/loads/{id}/offers/:
    get:
      operationId: loads_offers_list
      summary: 'Offers on a load: all of them for the shipper, only your own for a
        transporter'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - loads
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOfferList'
          description: ''
    post:
      operationId: loads_offers_create
      summary: Send an offer (transporters)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - loads
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfferCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OfferCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OfferCreate'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
          description: ''
  /api/loads/mine/:
    get:
      operationId: loads_mine_list
      summary: Loads you posted (shippers)
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - loads
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLoadList'
          description: ''
  /api/me/:
    get:
      operationId: me_retrieve
      summary: Your account
      tags:
      - me
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/notifications/:
    get:
      operationId: notifications_list
      summary: Your notifications, newest first
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - notifications
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNotificationList'
          description: ''
  /api/notifications/read/:
    post:
      operationId: notifications_read_create
      summary: Mark all your notifications as read
      tags:
      - notifications
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  marked:
                    type: integer
          description: ''
  /api/offers/{id}/accept/:
    post:
      operationId: offers_accept_create
      summary: Accept the offer at its current price
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - offers
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
          description: ''
  /api/offers/{id}/counter/:
    post:
      operationId: offers_counter_create
      summary: Answer with a new price
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - offers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Counter'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Counter'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Counter'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
          description: ''
  /api/offers/{id}/decline/:
    post:
      operationId: offers_decline_create
      summary: Decline the offer
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - offers
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
          description: ''
  /api/offers/{id}/withdraw/:
    post:
      operationId: offers_withdraw_create
      summary: Withdraw your offer (transporters)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - offers
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
          description: ''
  /api/offers/mine/:
    get:
      operationId: offers_mine_list
      summary: Offers you made (transporters)
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
        description: For example countered or accepted
      tags:
      - offers
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOfferList'
          description: ''
  /api/price-guide/:
    get:
      operationId: price_guide_retrieve
      summary: Suggested price for a route and weight
      parameters:
      - in: query
        name: destination
        schema:
          enum:
          - Beitbridge
          - Bindura
          - Binga
          - Bulawayo
          - Chegutu
          - Chimanimani
          - Chinhoyi
          - Chipinge
          - Chiredzi
          - Chirundu
          - Chitungwiza
          - Gokwe
          - Gweru
          - Harare
          - Hwange
          - Kadoma
          - Kariba
          - Karoi
          - Kwekwe
          - Lupane
          - Marondera
          - Masvingo
          - Mt Darwin
          - Mutare
          - Mvurwi
          - Norton
          - Nyamapanda
          - Plumtree
          - Redcliff
          - Rusape
          - Ruwa
          - Shamva
          - Shurugwi
          - Triangle
          - Victoria Falls
          - Zvishavane
          type: string
          minLength: 1
        description: |-
          * `Beitbridge` - Beitbridge
          * `Bindura` - Bindura
          * `Binga` - Binga
          * `Bulawayo` - Bulawayo
          * `Chegutu` - Chegutu
          * `Chimanimani` - Chimanimani
          * `Chinhoyi` - Chinhoyi
          * `Chipinge` - Chipinge
          * `Chiredzi` - Chiredzi
          * `Chirundu` - Chirundu
          * `Chitungwiza` - Chitungwiza
          * `Gokwe` - Gokwe
          * `Gweru` - Gweru
          * `Harare` - Harare
          * `Hwange` - Hwange
          * `Kadoma` - Kadoma
          * `Kariba` - Kariba
          * `Karoi` - Karoi
          * `Kwekwe` - Kwekwe
          * `Lupane` - Lupane
          * `Marondera` - Marondera
          * `Masvingo` - Masvingo
          * `Mt Darwin` - Mt Darwin
          * `Mutare` - Mutare
          * `Mvurwi` - Mvurwi
          * `Norton` - Norton
          * `Nyamapanda` - Nyamapanda
          * `Plumtree` - Plumtree
          * `Redcliff` - Redcliff
          * `Rusape` - Rusape
          * `Ruwa` - Ruwa
          * `Shamva` - Shamva
          * `Shurugwi` - Shurugwi
          * `Triangle` - Triangle
          * `Victoria Falls` - Victoria Falls
          * `Zvishavane` - Zvishavane
        required: true
      - in: query
        name: pickup
        schema:
          enum:
          - Beitbridge
          - Bindura
          - Binga
          - Bulawayo
          - Chegutu
          - Chimanimani
          - Chinhoyi
          - Chipinge
          - Chiredzi
          - Chirundu
          - Chitungwiza
          - Gokwe
          - Gweru
          - Harare
          - Hwange
          - Kadoma
          - Kariba
          - Karoi
          - Kwekwe
          - Lupane
          - Marondera
          - Masvingo
          - Mt Darwin
          - Mutare
          - Mvurwi
          - Norton
          - Nyamapanda
          - Plumtree
          - Redcliff
          - Rusape
          - Ruwa
          - Shamva
          - Shurugwi
          - Triangle
          - Victoria Falls
          - Zvishavane
          type: string
          minLength: 1
        description: |-
          * `Beitbridge` - Beitbridge
          * `Bindura` - Bindura
          * `Binga` - Binga
          * `Bulawayo` - Bulawayo
          * `Chegutu` - Chegutu
          * `Chimanimani` - Chimanimani
          * `Chinhoyi` - Chinhoyi
          * `Chipinge` - Chipinge
          * `Chiredzi` - Chiredzi
          * `Chirundu` - Chirundu
          * `Chitungwiza` - Chitungwiza
          * `Gokwe` - Gokwe
          * `Gweru` - Gweru
          * `Harare` - Harare
          * `Hwange` - Hwange
          * `Kadoma` - Kadoma
          * `Kariba` - Kariba
          * `Karoi` - Karoi
          * `Kwekwe` - Kwekwe
          * `Lupane` - Lupane
          * `Marondera` - Marondera
          * `Masvingo` - Masvingo
          * `Mt Darwin` - Mt Darwin
          * `Mutare` - Mutare
          * `Mvurwi` - Mvurwi
          * `Norton` - Norton
          * `Nyamapanda` - Nyamapanda
          * `Plumtree` - Plumtree
          * `Redcliff` - Redcliff
          * `Rusape` - Rusape
          * `Ruwa` - Ruwa
          * `Shamva` - Shamva
          * `Shurugwi` - Shurugwi
          * `Triangle` - Triangle
          * `Victoria Falls` - Victoria Falls
          * `Zvishavane` - Zvishavane
        required: true
      - in: query
        name: tonnes
        schema:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
        required: true
      tags:
      - price-guide
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceGuide'
          description: ''
  /api/trucks/:
    get:
      operationId: trucks_list
      summary: Available trucks
      parameters:
      - in: query
        name: location
        schema:
          type: string
      - in: query
        name: min_capacity
        schema:
          type: number
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: type
        schema:
          type: string
      tags:
      - trucks
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTruckPublicList'
          description: ''
  /api/trucks/mine/:
    get:
      operationId: trucks_mine_list
      summary: Your own trucks, with document dates (transporters)
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - trucks
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTruckOwnList'
          description: ''
  /api/wallet/:
    get:
      operationId: wallet_retrieve
      summary: Your simulated wallet balance and recent entries
      tags:
      - wallet
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
          description: ''
components:
  schemas:
    AuthToken:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        token:
          type: string
          readOnly: true
      required:
      - password
      - token
      - username
    Booking:
      type: object
      properties:
        offer_id:
          type: integer
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        shipper_fee:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
        transporter_fee:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
        shipper_paid:
          type: boolean
        transporter_paid:
          type: boolean
        fees_paid:
          type: boolean
        pay_deadline:
          type: string
          format: date-time
          nullable: true
      required:
      - fees_paid
      - offer_id
      - pay_deadline
      - price
      - shipper_fee
      - shipper_paid
      - transporter_fee
      - transporter_paid
    CargoTypeEnum:
      enum:
      - general
      - bulk
      - perishable
      - fragile
      - hazardous
      - livestock
      type: string
      description: |-
        * `general` - General cargo
        * `bulk` - Bulk
        * `perishable` - Perishable
        * `fragile` - Fragile
        * `hazardous` - Hazardous
        * `livestock` - Livestock
    Contact:
      type: object
      properties:
        username:
          type: string
        phone:
          type: string
      required:
      - phone
      - username
    Contacts:
      type: object
      properties:
        shipper:
          allOf:
          - $ref: '#/components/schemas/Contact'
          nullable: true
        transporter:
          $ref: '#/components/schemas/Contact'
      required:
      - shipper
      - transporter
    Counter:
      type: object
      properties:
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
      required:
      - price
    LedgerEntry:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        kind:
          $ref: '#/components/schemas/LedgerEntryKindEnum'
        kind_label:
          type: string
          readOnly: true
        note:
          type: string
          maxLength: 200
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - created_at
      - id
      - kind
      - kind_label
    LedgerEntryKindEnum:
      enum:
      - topup
      - withdraw
      - escrow_hold
      - escrow_release
      - escrow_refund
      - subscription
      - referral_bonus
      type: string
      description: |-
        * `topup` - Top up (simulated)
        * `withdraw` - Withdrawal (simulated)
        * `escrow_hold` - Moved into escrow
        * `escrow_release` - Paid out of escrow
        * `escrow_refund` - Refunded from escrow
        * `subscription` - Plan subscription
        * `referral_bonus` - Referral bonus
    Load:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 100
        pickup:
          type: string
          maxLength: 100
        destination:
          type: string
          maxLength: 100
        distance_km:
          type: integer
          nullable: true
          readOnly: true
        cargo_type:
          $ref: '#/components/schemas/CargoTypeEnum'
        weight_tonnes:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
        truck_type_needed:
          $ref: '#/components/schemas/TruckTypeNeededEnum'
        offered_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        urgency:
          $ref: '#/components/schemas/UrgencyEnum'
        pickup_date:
          type: string
          format: date
          nullable: true
        description:
          type: string
        insured:
          type: boolean
        insurance_provider:
          type: string
          maxLength: 100
        coverage_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
        status:
          $ref: '#/components/schemas/LoadStatusEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        shipper:
          allOf:
          - $ref: '#/components/schemas/UserBrief'
          readOnly: true
      required:
      - created_at
      - destination
      - distance_km
      - id
      - offered_price
      - pickup
      - shipper
      - title
      - weight_tonnes
    LoadCreate:
      type: object
      properties:
        title:
          type: string
          maxLength: 100
        pickup:
          type: string
          maxLength: 100
        destination:
          type: string
          maxLength: 100
        cargo_type:
          $ref: '#/components/schemas/CargoTypeEnum'
        weight_tonnes:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
        truck_type_needed:
          $ref: '#/components/schemas/TruckTypeNeededEnum'
        offered_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        urgency:
          $ref: '#/components/schemas/UrgencyEnum'
        pickup_date:
          type: string
          format: date
          nullable: true
        description:
          type: string
        insured:
          type: boolean
        insurance_provider:
          type: string
          maxLength: 100
        coverage_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
      required:
      - destination
      - offered_price
      - pickup
      - title
      - weight_tonnes
    LoadDetail:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 100
        pickup:
          type: string
          maxLength: 100
        destination:
          type: string
          maxLength: 100
        distance_km:
          type: integer
          nullable: true
          readOnly: true
        cargo_type:
          $ref: '#/components/schemas/CargoTypeEnum'
        weight_tonnes:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
        truck_type_needed:
          $ref: '#/components/schemas/TruckTypeNeededEnum'
        offered_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        urgency:
          $ref: '#/components/schemas/UrgencyEnum'
        pickup_date:
          type: string
          format: date
          nullable: true
        description:
          type: string
        insured:
          type: boolean
        insurance_provider:
          type: string
          maxLength: 100
        coverage_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
        status:
          $ref: '#/components/schemas/LoadStatusEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        shipper:
          allOf:
          - $ref: '#/components/schemas/UserBrief'
          readOnly: true
        my_offer:
          allOf:
          - $ref: '#/components/schemas/Offer'
          nullable: true
          readOnly: true
        booking:
          allOf:
          - $ref: '#/components/schemas/Booking'
          nullable: true
          readOnly: true
        contacts:
          allOf:
          - $ref: '#/components/schemas/Contacts'
          nullable: true
          readOnly: true
      required:
      - booking
      - contacts
      - created_at
      - destination
      - distance_km
      - id
      - my_offer
      - offered_price
      - pickup
      - shipper
      - title
      - weight_tonnes
    LoadStatusEnum:
      enum:
      - open
      - booked
      - delivered
      - expired
      type: string
      description: |-
        * `open` - Open
        * `booked` - Booked
