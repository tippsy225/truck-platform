{% extends 'base.html' %}

{% block title %}{{ heading }}{% endblock %}

{% block content %}
<div class="page-head">
  <h1>{{ heading }}</h1>
  <p class="muted mb-0">Insurance and roadworthy dates are required to bid on loads, and they must be in the future.</p>
</div>
<div style="max-width:560px;">
  <form method="post" class="card p-4">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary">Save truck</button>
      <a href="{% url 'my_trucks' %}" class="btn btn-outline-primary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
