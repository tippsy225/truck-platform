{% extends 'base.html' %}

{% block title %}Register a truck{% endblock %}

{% block content %}
<div style="max-width: 500px;">
  <h1 class="mb-3">Register a truck</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Save truck</button>
  </form>
</div>
{% endblock %}
